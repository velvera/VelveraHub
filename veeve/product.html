    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const target = document.getElementById('productDetail');
            const id = new URLSearchParams(location.search).get('id');
            window.Store?.loadWishlist?.();
            const esc = (value) => UI.escapeHtml ? UI.escapeHtml(String(value ?? '')) : String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
            const emptyState = (title, copy, icon = 'fa-box-open') => {
                target.innerHTML = `<div class="location-empty-state"><i class="fas ${icon}"></i><strong>${esc(title)}</strong><span>${esc(copy)}</span><a href="/pages/products.html">Browse products</a></div>`;
            };
            if (!id) {
                emptyState('Product not found', 'Return to the catalogue to choose a live listing.', 'fa-magnifying-glass');
                return;
            }
            let result;
            try {
                result = await ProductsService.getProduct(id);
            } catch (error) {
                result = { error };
            }
            if (result.error || !result.data) {
                emptyState('Product unavailable', 'This listing is no longer published or the live catalogue is unavailable.');
                return;
            }
            const product = result.data;
            document.title = `${product.title || 'Product'} - VelveraHub`;
            const descriptionMeta = document.querySelector('meta[name="description"]');
            if (descriptionMeta) {
                descriptionMeta.setAttribute('content', `${product.title || 'Marketplace listing'} on VelveraHub. ${String(product.description || 'View product details, seller information, and delivery options.').slice(0, 145)}`);
            }
            const media = (product.product_images || product.images || [])
                .filter((item) => item?.url)
                .sort((a, b) => Number(Boolean(b.is_primary)) - Number(Boolean(a.is_primary)) || Number(a.display_order || 0) - Number(b.display_order || 0));
            if (!media.length && product.image) media.push({ url: product.image, is_primary: true, alt_text: 'image' });
            const isVideo = (item) => item?.alt_text === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(item?.url || '');
            const price = product.formattedPrice || (window.RegionService?.formatPrice ? window.RegionService.formatPrice(product.price) : product.price || '');
            const productCurrency = window.RegionService?.currency?.code || 'NGN';
            const productAmount = Number(product.price) * (window.RegionService?.conversionFactor || 1);
            const primaryImage = media.find((item) => !isVideo(item))?.url || product.image || '';
            const canonicalProductUrl = window.VelveraProductSharing?.canonicalUrl(product.id || id) || location.href;
            const absoluteShareImage = (() => {
                try {
                    const image = new URL(primaryImage || '/img/logo.png', window.location.origin);
                    return ['http:', 'https:'].includes(image.protocol) ? image.href : new URL('/img/logo.png', window.location.origin).href;
                } catch (_) {
                    return new URL('/img/logo.png', window.location.origin).href;
                }
            })();
            window.VelveraProductSharing?.setProductMetadata({
                product,
                price,
                url: canonicalProductUrl,
                imageUrl: absoluteShareImage,
                currency: productCurrency,
                amount: productCurrency === 'NGN' ? Math.round(productAmount) : productAmount.toFixed(2)
            });
            const shop = product.shops || {};
            const sellerName = product.seller?.display_name || shop.name || 'Seller';
            const hasShop = Boolean(product.shop_id || shop.id);
            const manualPaymentAllowed = hasShop && shop.verified === true;
            const publicContact = hasShop ? shop : (product.seller?.contact || {});
            const contactActions = [];
            const addContactAction = (href, label, icon) => {
                if (href) contactActions.push(`<a class="seller-contact-action" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><i class="${icon}" aria-hidden="true"></i><span>${esc(label)}</span></a>`);
            };
            const safeHttpsLink = (value, allowedHosts = []) => {
                const raw = String(value || '').trim();
                if (!raw) return null;
                const candidate = /^www\./i.test(raw) ? `https://${raw}` : raw;
                try {
                    const url = new URL(candidate);
                    if (url.protocol !== 'https:' || url.username || url.password) return null;
                    if (allowedHosts.length && !allowedHosts.some((host) => url.hostname === host || url.hostname.endsWith(`.${host}`))) return null;
                    return url.href;
                } catch (_) {
                    return null;
                }
            };
            const phone = String(publicContact.phone || publicContact.public_phone || '').trim();
            const phoneDigits = phone.replace(/\D/g, '');
            if (/^\+?[\d\s().-]+$/.test(phone) && phoneDigits.length >= 7 && phoneDigits.length <= 15) {
                addContactAction(`tel:${phone.startsWith('+') ? '+' : ''}${phoneDigits}`, 'Call seller', 'fas fa-phone');
            }
            const email = String(publicContact.email || publicContact.public_email || '').trim();
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                addContactAction(`mailto:${email}`, 'Email seller', 'fas fa-envelope');
            }
            const whatsapp = String(publicContact.whatsapp || '').trim();
            const whatsappUrl = /^https?:\/\//i.test(whatsapp) || /^www\./i.test(whatsapp)
                ? safeHttpsLink(whatsapp, ['wa.me', 'whatsapp.com'])
                : (/^\+?[\d\s().-]+$/.test(whatsapp) && whatsapp.replace(/\D/g, '').length >= 7
                    ? `https://wa.me/${whatsapp.replace(/\D/g, '')}`
                    : null);
            addContactAction(whatsappUrl, 'WhatsApp', 'fab fa-whatsapp');
            const socialUrl = (value, domain, hosts = [domain]) => {
                const raw = String(value || '').trim();
                if (!raw) return null;
                if (/^(https?:\/\/|www\.)/i.test(raw) || raw.toLowerCase().includes(domain)) {
                    const normalized = /^https?:\/\//i.test(raw) || /^www\./i.test(raw) ? raw : `https://${raw}`;
                    return safeHttpsLink(normalized, hosts);
                }
                const handle = raw.replace(/^@+/, '').replace(/^\/+/, '');
                return /^[A-Za-z0-9._-]{1,80}$/.test(handle) ? `https://${domain}/${encodeURIComponent(handle)}` : null;
            };
            addContactAction(socialUrl(publicContact.instagram, 'instagram.com'), 'Instagram', 'fab fa-instagram');
            addContactAction(socialUrl(publicContact.facebook, 'facebook.com', ['facebook.com', 'fb.com']), 'Facebook', 'fab fa-facebook');
            addContactAction(socialUrl(publicContact.twitter, 'x.com', ['x.com', 'twitter.com']), 'X / Twitter', 'fab fa-x-twitter');
            addContactAction(safeHttpsLink(publicContact.other_contact_url), publicContact.other_contact_label || 'Other contact', 'fas fa-arrow-up-right-from-square');
            const stockLabel = Number(product.stock) > 0 ? `${product.stock} available` : 'Contact seller for availability';
            const specs = [
                ['Condition', product.condition || 'Not specified'],
                ['Location', [product.location, product.school_name, product.campus_area].filter(Boolean).join(' · ') || 'Seller location provided at checkout'],
            ];
            const renderDeliveryOptions = (value) => {
                const options = value && typeof value === 'object' ? value : {};
                const methods = [
                    ['pickup', 'Pickup or collection'],
                    ['local_delivery', 'Local delivery'],
                    ['regional_delivery', 'Delivery beyond the local area']
                ].filter(([key]) => options[key] === true);
                const notes = String(options.notes || '').trim();
                if (!methods.length && !notes) {
                    return '<p class="product-delivery-empty">Ask the seller to confirm pickup or delivery options and any fees before arranging payment.</p>';
                }
                return `${methods.length ? `<ul class="product-delivery-options">${methods.map(([, label]) => `<li><i class="fas fa-circle-check" aria-hidden="true"></i>${esc(label)}</li>`).join('')}</ul>` : ''}${notes ? `<p class="product-delivery-notes">${esc(notes)}</p>` : ''}<p class="product-delivery-disclaimer">Confirm the delivery area, fee, and timing with the seller before payment.</p>`;
            };
            const renderPaymentOptions = () => {
                if (!manualPaymentAllowed) {
                    return '<p class="product-delivery-empty">Discuss payment with the seller in chat. This shop is not currently approved for manual prepayment.</p>';
                }
                if (shop.manual_payment_preference === 'seller_direct' && shop.manual_payment_method) {
                    return `<p><strong>Seller’s preferred method:</strong> ${esc(shop.manual_payment_method)}</p><p class="product-delivery-disclaimer">Message the seller to agree on payment and delivery before arranging anything.</p>`;
                }
                return '<p><strong>VelveraHub manual payment</strong> is enabled for this shop under the current marketplace policy. Message the seller to agree on delivery and confirm payment details before paying. Transfer instructions are shown after checkout when the admin account is configured for this market.</p>';
            };
            target.innerHTML = `
                <nav class="product-breadcrumbs" aria-label="Breadcrumb"><a href="/pages/products.html">Catalogue</a><span>/</span><strong>${esc(product.title)}</strong></nav>
                <article class="product-detail-card">
                    <section class="product-gallery" aria-label="Product media">
                        <div class="product-detail-image" id="productMediaStage"></div>
                        <button class="product-share-button" id="shareProductButton" type="button" aria-label="Share product link" title="Share product link"><i class="fas fa-share-nodes" aria-hidden="true"></i></button>
                        <div class="product-thumbnails" id="productThumbnails" role="list"></div>
                    </section>
                    <section class="product-detail-copy">
                        <div class="product-detail-title-row">
                            <div class="product-detail-title-copy"><h1>${esc(product.title)}</h1></div>
                        </div>
                        <span class="visually-hidden" id="productShareStatus" role="status" aria-live="polite"></span>
                        <div class="product-rating-row"><span>Verified-purchase reviews are not available yet.</span></div>
                        <strong class="product-detail-price">${esc(price)}</strong>
                        <p class="product-stock"><i class="fas fa-circle"></i> ${esc(stockLabel)}</p>
                        <div class="product-action-row"><label class="quantity-control">Qty <input id="productQuantity" type="number" min="1" max="${Math.max(1, Number(product.stock) || 1)}" value="1" aria-label="Quantity"></label><button class="btn btn-secondary product-save-button" id="saveProduct" type="button" aria-label="Save product" title="Save product" aria-pressed="false"><i class="far fa-heart" aria-hidden="true"></i></button><button class="btn btn-primary" id="addToCart" type="button"><i class="fas fa-cart-plus"></i> Add to cart</button></div>
                    </section>
                </article>
                <div class="product-detail-sections">
                    <section class="product-info-panel"><h2>Description</h2><p>${esc(product.description || 'The seller has not added a description yet.')}</p></section>
                    <section class="product-info-panel product-delivery-panel"><h2>Delivery options</h2>${renderDeliveryOptions(product.delivery_options, esc)}</section>
                    <section class="product-info-panel product-payment-panel"><h2>Payment options</h2>${renderPaymentOptions()}</section>
                    <section class="product-info-panel"><h2>Details and specifications</h2><dl class="product-spec-grid">${specs.map(([label, value]) => `<div><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl></section>
                    <section class="product-info-panel seller-panel"><div class="seller-panel-avatar">${shop.logo_url ? `<img src="${esc(shop.logo_url)}" alt="${esc(sellerName)} logo">` : '<i class="fas fa-store" aria-hidden="true"></i>'}</div><div class="seller-panel-details"><h2>${esc(sellerName)}</h2>${window.TrustService?.renderVerificationBadges(shop) || ''}${[shop.city, shop.country].filter(Boolean).length ? `<p>${esc([shop.city, shop.country].filter(Boolean).join(', '))}</p>` : ''}</div><a class="btn btn-secondary" href="/pages/products.html">View more</a></section>
                    <section class="product-info-panel product-chat-panel" id="productMessagePanel" aria-labelledby="productMessageHeading">
                        <div class="product-chat-heading"><div><h2 id="productMessageHeading">Message the seller</h2></div><span class="product-chat-privacy"><i class="fas fa-lock" aria-hidden="true"></i> Only you and the seller</span></div>
                        <p class="product-chat-intro">Ask a question about this listing or agree on payment and delivery. Your conversation stays connected to this product.</p>
                        <div class="product-chat-prompts" aria-label="Quick message suggestions">
                            <button type="button" data-chat-prompt="Is this available?" data-no-processing>Is this available?</button>
                            <button type="button" data-chat-prompt="I would like to make an offer." data-no-processing>Make an offer</button>
                            <button type="button" data-chat-prompt="What is your best price?" data-no-processing>Best price?</button>
                            <button type="button" data-chat-prompt="Can we agree on payment and delivery options?" data-no-processing>Payment &amp; delivery</button>
                        </div>
                        <div class="product-chat-thread" data-chat-thread role="log" aria-live="polite" aria-label="Conversation messages" hidden></div>
                        <form class="product-chat-form" data-chat-form>
                            <label for="productChatMessage">Your message</label>
                            <textarea id="productChatMessage" data-chat-input rows="3" maxlength="2000" placeholder="Write a question about this product…" required></textarea>
                            <div class="product-chat-form-footer"><span>Up to 2,000 characters</span><button class="btn btn-primary" type="submit" data-chat-submit><i class="fas fa-paper-plane" aria-hidden="true"></i> Send message</button></div>
                        </form>
                        <p class="product-chat-status" data-chat-status role="status" aria-live="polite"></p>
                    </section>
                    <section class="product-info-panel seller-contact-panel"><h2>Contact the seller</h2>${contactActions.length ? `<div class="seller-contact-actions">${contactActions.join('')}</div>` : '<p class="seller-contact-empty">The seller has not shared public contact details.</p>'}<p class="seller-trust-note">${hasShop ? 'Only the verification badges shown above describe checks currently recorded for this seller.' : 'No seller verification records are available for this listing. Contact details are shared by the seller and do not represent an identity check.'}</p></section>
                    <section class="product-info-panel"><h2>Reviews</h2><p>Verified-purchase reviews are not available yet. VelveraHub does not display unverified ratings.</p></section>
                    <section class="product-info-panel product-safety-panel"><h2>Safety tips</h2><ul class="product-safety-tips"><li>Use only payment methods presented in the official checkout.</li><li>Confirm the delivery area, fees, and timing before placing an order.</li><li>Review the product condition and seller details before checkout.</li><li>Keep your order reference and relevant messages.</li><li>Never share passwords, one-time codes, or payment credentials with a seller.</li></ul></section>
                </div>
                <div class="product-mobile-actions"><strong>${esc(price)}</strong><button class="btn btn-primary" type="button" data-mobile-add><i class="fas fa-cart-plus"></i> Add to cart</button></div>
                <section class="related-products-section" id="relatedProducts"><div class="section-heading"><div><p class="eyebrow">Keep exploring</p><h2>More from the catalogue</h2></div><a href="/pages/products.html">Browse all <i class="fas fa-arrow-right"></i></a></div><div class="related-products-grid"></div></section>`;

            window.VelveraProductSharing?.bindShareButton(
                document.getElementById('shareProductButton'),
                {
                    title: product.title || 'VelveraHub listing',
                    text: `${price}${product.description ? ` · ${String(product.description).replace(/\s+/g, ' ').trim().slice(0, 180)}` : ''}`,
                    url: canonicalProductUrl
                }
            );
            window.ProductChat?.mount(document.getElementById('productMessagePanel'), product);
            const stage = document.getElementById('productMediaStage');
            const thumbnails = document.getElementById('productThumbnails');
            const renderMedia = (item) => {
                const safeUrl = esc(item.url);
                stage.innerHTML = isVideo(item)
                    ? `<video src="${safeUrl}" controls playsinline aria-label="${esc(product.title)} video"></video>`
                        : `<picture>${ProductsService.getTransformedImageUrl(item.url, { width: 960, height: 720, format: 'avif' }) ? `<source type="image/avif" srcset="${esc(ProductsService.getTransformedImageUrl(item.url, { width: 960, height: 720, format: 'avif' }))}">` : ''}${ProductsService.getTransformedImageUrl(item.url, { width: 960, height: 720, format: 'webp' }) ? `<source type="image/webp" srcset="${esc(ProductsService.getTransformedImageUrl(item.url, { width: 960, height: 720, format: 'webp' }))}">` : ''}<img src="${safeUrl}" alt="${esc(product.title)}" width="960" height="720" loading="eager" decoding="async" tabindex="0" role="button" aria-label="Expand ${esc(product.title)} image" onerror="this.onerror=null;this.src='/img/product-placeholder.svg';"></picture>`;
                stage.onclick = (event) => {
                    if (!event.target.matches('img')) return;
                    stage.classList.toggle('is-expanded');
                };
            };
            media.forEach((item, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `product-thumbnail${index === 0 ? ' active' : ''}`;
                button.setAttribute('aria-label', `${isVideo(item) ? 'Video' : 'Image'} ${index + 1}`);
                button.innerHTML = isVideo(item) ? `<video src="${esc(item.url)}" muted playsinline aria-label="${esc(product.title)} video thumbnail"></video><i class="fas fa-play" aria-hidden="true"></i>` : `<img src="${esc(item.url)}" alt="${esc(product.title)} thumbnail">`;
                button.addEventListener('click', () => {
                    thumbnails.querySelectorAll('.product-thumbnail').forEach((node) => node.classList.remove('active'));
                    button.classList.add('active');
                    renderMedia(item);
                });
                thumbnails.appendChild(button);
            });
            if (media[0]) renderMedia(media[0]);
            stage.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && stage.classList.contains('is-expanded')) {
                    stage.classList.remove('is-expanded');
                    return;
                }
                if (['Enter', ' '].includes(event.key) && event.target.matches('img')) {
                    event.preventDefault();
                    stage.classList.toggle('is-expanded');
                }
            });
            const addToCart = () => {
                const quantity = Math.max(1, Number(document.getElementById('productQuantity')?.value) || 1);
                CartService.addItem(product, quantity);
                window.UI?.showToast?.('Added to cart', 'success');
            };
            document.querySelectorAll('#addToCart, [data-mobile-add]').forEach((button) => button.addEventListener('click', addToCart));
            const saveButton = document.getElementById('saveProduct');
            const updateSavedState = (isSaved) => {
                saveButton?.classList.toggle('is-saved', isSaved);
                saveButton?.setAttribute('aria-pressed', String(isSaved));
                saveButton?.setAttribute('aria-label', isSaved ? 'Remove from saved items' : 'Save product');
                saveButton?.querySelector('i')?.classList.toggle('far', !isSaved);
                saveButton?.querySelector('i')?.classList.toggle('fas', isSaved);
            };
            updateSavedState(Boolean(window.Store?.isInWishlist?.(product.id)));
            saveButton?.addEventListener('click', () => {
                window.Store?.toggleWishlist?.(product.id);
                const isSaved = Boolean(window.Store?.isInWishlist?.(product.id));
                updateSavedState(isSaved);
                window.UI?.showToast?.(isSaved ? 'Saved to your favourites' : 'Removed from favourites', 'success');
            });
            try {
                const related = await ProductsService.getProducts({ category: product.category, limit: 8, location: 'all' });
                const items = (related.data || []).filter((item) => String(item.id) !== String(product.id)).slice(0, 4);
                if (items.length < 2) {
                    const fallback = await ProductsService.getProducts({ limit: 8, location: 'all' });
                    const seen = new Set([String(product.id), ...items.map((item) => String(item.id))]);
                    for (const item of fallback.data || []) {
                        if (seen.has(String(item.id))) continue;
                        items.push(item);
                        seen.add(String(item.id));
                        if (items.length === 4) break;
                    }
                }
                const grid = document.querySelector('.related-products-grid');
                if (grid) grid.innerHTML = items.length ? items.map((item) => UI.renderProductCard(item)).join('') : '<p class="product-muted">No related listings yet.</p>';
            } catch (_) {
                document.querySelector('.related-products-grid')?.replaceChildren();
            }
        });
    </script>
</body>
</html>
