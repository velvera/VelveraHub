<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Confirmation from VelveraHub after your account, order, or marketplace action.">
    <link rel="icon" href="../img/favicon.ico">
    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <title>Action complete - VelveraHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="../assets/css/base.css" rel="stylesheet">
    <link href="../assets/css/components/navbar.css" rel="stylesheet">
    <link href="../assets/css/components/landing-pages.css" rel="stylesheet">
    <link href="../assets/css/components/footer.css" rel="stylesheet">
    <style>
        .manual-payment-instructions {
            width: min(100%, 760px);
            margin: 1.5rem auto 0;
            padding: 1.25rem;
            border: 1px solid #ddd6fe;
            border-radius: 14px;
            background: #faf8ff;
            text-align: left;
        }
        .manual-payment-instructions h2,
        .manual-payment-destination h3 {
            margin: 0 0 .65rem;
        }
        .manual-payment-instructions p {
            margin: .4rem 0;
            overflow-wrap: anywhere;
        }
        .manual-payment-destination {
            padding: .9rem 0;
            border-top: 1px solid #e8e3f4;
        }
        .manual-payment-destination:first-child {
            border-top: 0;
        }
        .manual-payment-free-text {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo" aria-label="VelveraHub home">
                <span class="logo-icon" aria-hidden="true"></span>
                <span class="logo-text">Velvera<span class="accent">Hub</span></span>
            </a>
        </div>
    </nav>
    <main class="landing-main">
        <section class="section-container landing-hero" aria-labelledby="successTitle">
            <span class="landing-eyebrow"><i class="fas fa-circle-check" aria-hidden="true"></i> VelveraHub confirmation</span>
            <h1 id="successTitle">You’re all set</h1>
            <p id="successMessage">Your action was completed successfully.</p>
            <p id="successDetail" class="success-detail" hidden></p>
            <section class="manual-payment-instructions" id="manualPaymentInstructions" aria-live="polite" hidden>
                <h2>Payment instructions</h2>
                <p id="manualPaymentStatus"></p>
                <div id="manualPaymentDestinations"></div>
            </section>
            <div class="landing-actions">
                <a class="btn btn-primary" id="successNext" href="/veeve/account.html">Continue</a>
                <a class="btn btn-secondary" href="/veeve/products.html">Keep shopping</a>
            </div>
        </section>
    </main>
    <footer class="footer shared-footer" data-collapsible-footer data-shared-footer-placeholder aria-label="VelveraHub site footer"></footer>
    <script src="../assets/js/components/focus-manager.js"></script>
<script src="../assets/js/components/site-navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/services/region.js"></script>
    <script src="../assets/js/config.js"></script>
<script src="../assets/js/services/api.js"></script>
    <script src="../assets/js/services/publicSupabaseConfig.js"></script>
    <script src="../assets/js/services/observability.js"></script>
<script src="../assets/js/services/supabaseClient.js"></script>
    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'general';
            const pending = params.get('pending') === '1';
            const order = params.get('order');
            const copy = {
                registration: {
                    title: pending ? 'Check your email to finish signing up' : 'Your account is ready',
                    message: pending
                        ? 'We created your VelveraHub account. Confirm your email, then sign in to continue.'
                        : 'Your VelveraHub account was created successfully.',
                    next: 'Go to account',
                    href: '/pages/account.html'
                },
                order: {
                    title: 'Order received',
                    message: 'Your order was created and is pending payment confirmation.',
                    next: 'View your account',
                    href: '/pages/account.html'
                },
                listing: {
                    title: 'Listing submitted',
                    message: 'Your marketplace listing was published successfully.',
                    next: 'Manage your listing',
                    href: '/pages/sell.html'
                },
                general: {
                    title: 'You’re all set',
                    message: 'Your VelveraHub action was completed successfully.',
                    next: 'Continue',
                    href: '/pages/account.html'
                }
            };
            const selected = copy[type] || copy.general;
            document.title = `${selected.title} - VelveraHub`;
            document.getElementById('successTitle').textContent = selected.title;
            document.getElementById('successMessage').textContent = selected.message;
            const detail = document.getElementById('successDetail');
            if (order && /^[A-Za-z0-9_-]{1,80}$/.test(order)) {
                detail.textContent = `Order reference: ${order}`;
                detail.hidden = false;
            }
            const next = document.getElementById('successNext');
            const requestedNext = params.get('next');
            next.textContent = selected.next;
            next.href = requestedNext && requestedNext.startsWith('/') && !requestedNext.startsWith('//')
                ? requestedNext
                : selected.href;

            if (type === 'order' && params.get('payment') === 'manual') {
                const panel = document.getElementById('manualPaymentInstructions');
                const status = document.getElementById('manualPaymentStatus');
                const destinations = document.getElementById('manualPaymentDestinations');
                panel.hidden = false;
                const orderId = params.get('order_id') || '';
                if (!/^[0-9a-f-]{36}$/i.test(orderId)) {
                    status.textContent = 'The order was created, but payment instructions are unavailable here. Message the seller to confirm payment and delivery before paying.';
                    return;
                }
                try {
                    if (window.supabaseConfigReady) await window.supabaseConfigReady;
                    const supabase = window.SupabaseClient?.get();
                    if (!supabase) throw new Error('Payment details are unavailable');
                    const { data, error } = await supabase.rpc('get_order_manual_payment_details', {
                        p_order_id: orderId
                    });
                    if (error) throw error;
                    const entries = Array.isArray(data?.destinations) ? data.destinations : [];
                    if (!entries.length) throw new Error('Payment instructions were not returned');
                    status.textContent = data.payment_status === 'paid'
                        ? 'Payment for this order has already been confirmed.'
                        : data.notice || 'Your order is pending. Confirm payment and delivery arrangements with the seller before paying.';
                    for (const entry of entries) {
                        const card = document.createElement('section');
                        card.className = 'manual-payment-destination';
                        const heading = document.createElement('h3');
                        heading.textContent = entry.recipient_type === 'seller'
                            ? `Payment to ${entry.shop_name || 'the seller'}`
                            : `VelveraHub account · ${entry.shop_name || 'marketplace order'}`;
                        card.appendChild(heading);
                        const addDetail = (label, value, className = '') => {
                            if (!value) return;
                            const line = document.createElement('p');
                            const title = document.createElement('strong');
                            title.textContent = `${label}: `;
                            line.append(title, document.createTextNode(String(value)));
                            if (className) line.classList.add(className);
                            card.appendChild(line);
                        };
                    const paymentCurrency = data.region === 'uk' ? 'GBP' : 'NGN';
                    const shopAmount = new Intl.NumberFormat(undefined, {
                        style: 'currency',
                        currency: paymentCurrency
                    }).format(Number(entry.shop_total) || 0);
                    addDetail('Item subtotal for this shop', shopAmount);
                        addDetail('Method', entry.method);
                        addDetail('Bank', entry.bank_name);
                        addDetail('Account name', entry.account_name);
                        addDetail('Account number', entry.account_number);
                        addDetail('Sort code', entry.sort_code);
                        addDetail('Instructions', entry.instructions, 'manual-payment-free-text');
                        destinations.appendChild(card);
                    }
                } catch (_) {
                    status.textContent = 'Your order is pending, but payment instructions could not be loaded. Message the seller to confirm payment and delivery before paying.';
                }
            }
        })();
    </script>
</body>
</html>
